name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Detect Package Location and Build APK
        run: |
          if [ -f "package.json" ]; then
            echo "Building from root directory..."
            npm install
            npx expo prebuild --platform android --no-install
            cd android
            ./gradlew assembleRelease
            if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
              echo "Signing unsigned APK..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
              $APKSIGNER sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
            fi
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_ENV
          elif [ -f "mobile/package.json" ]; then
            echo "Building from mobile/ directory..."
            cd mobile
            npm install
            npx expo prebuild --platform android --no-install
            cd android
            ./gradlew assembleRelease
            if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
              echo "Signing unsigned APK..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
              $APKSIGNER sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
            fi
            echo "APK_PATH=mobile/android/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_ENV
          else
            echo "Error: package.json not found in root or mobile/!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geeta-slok-release-apk
          path: ${{ env.APK_PATH }}
